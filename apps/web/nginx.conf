server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache long pour les assets fingerprintés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache sans revalidation : sinon, après un
    # déploiement, le navigateur garde l'ancienne page qui charge l'ancien JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: toute route inconnue -> index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
